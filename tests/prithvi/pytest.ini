[pytest]
# Where pytest looks for the test files
testpaths = tests

# -v                         : list every test with PASSED / FAILED / ERROR
# --browser chromium         : run the tests in Chromium (Chrome)
# --screenshot only-on-failure : Playwright saves an extra screenshot if a test fails
# --output test-results      : folder for those failure screenshots
# --html / --self-contained-html : one HTML summary of all 9 results (good for the report)
addopts = -v --browser chromium --screenshot only-on-failure --output test-results --html=report.html --self-contained-html
